name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: showtech
          POSTGRES_PASSWORD: showtech_dev
          POSTGRES_DB: gestor_eventos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U showtech -d gestor_eventos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://showtech:showtech_dev@127.0.0.1:5433/gestor_eventos?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # El código de storage/db es generado: si alguien cambia un .sql o una migración sin ejecutar `sqlc generate`, falla aquí.
      # La versión coincide con la que figura en la cabecera de los archivos generados.
      - name: El código de sqlc está al día
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- storage/db storage/empresadb
      - run: go vet ./...
      - run: go test ./... -count=1

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build

  e2e:
    name: Pruebas de extremo a extremo (Playwright + Chrome)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Los runners de GitHub ya traen Google Chrome; la configuración usa channel: 'chrome' y no descarga navegadores
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-trazas
          path: frontend/test-results
